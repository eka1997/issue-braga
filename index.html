<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISSUE Cafe 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: full-bleed 3D canvas; floating glass panels pinned to safe-area edges; vertical cut slider on the right edge */
:root{
  --bg:#e9e6e1; --panel:rgba(250,248,245,.86); --line:rgba(40,36,32,.14);
  --fg:#2a2622; --muted:#6f675e; --accent:#b4552d; --accent-fg:#fff; --chip:#f3efe9;
  --sky-top:#f4f1ec; --sky-bot:#d9d3ca;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1a18; --panel:rgba(36,33,30,.86); --line:rgba(255,245,235,.12);
  --fg:#efe9e1; --muted:#a69d92; --accent:#e07a4b; --accent-fg:#1c1a18; --chip:#2e2a26;
  --sky-top:#2a2724; --sky-bot:#151311; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a18; --panel:rgba(36,33,30,.86); --line:rgba(255,245,235,.12);
  --fg:#efe9e1; --muted:#a69d92; --accent:#e07a4b; --accent-fg:#1c1a18; --chip:#2e2a26;
  --sky-top:#2a2724; --sky-bot:#151311; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;background:linear-gradient(var(--sky-top),var(--sky-bot))}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;z-index:5}
#brand{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:10px 14px}
#brand b{font-weight:800;letter-spacing:.14em;font-size:15px}
#brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em;margin-top:2px}
#layers{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));padding:6px;
  display:flex;flex-wrap:wrap;gap:4px;max-width:58vw;justify-content:flex-end}
.chip{font:600 12px var(--display);border:1px solid var(--line);background:var(--chip);color:var(--fg);
  padding:7px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
#bar{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100% - 92px - max(12px,env(safe-area-inset-left,0px))))}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{font:600 13px var(--display);border:0;background:transparent;color:var(--fg);padding:8px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
select{font:600 13px var(--display);background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:150px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#cut{right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:62px;padding:10px 0;
  display:flex;flex-direction:column;align-items:center;gap:8px}
#cut .lab{font:500 10px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#cut .val{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
#cutWrap{height:min(42vh,300px);width:44px;position:relative}
#cutRange{position:absolute;left:50%;top:50%;width:min(42vh,300px);height:44px;transform:translate(-50%,-50%) rotate(-90deg);
  accent-color:var(--accent);background:transparent;margin:0}
#full{font:600 11px var(--display);border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:8px;padding:6px 8px;cursor:pointer}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  font:400 11px var(--mono);color:var(--muted);z-index:4;white-space:nowrap;transition:opacity .6s}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;
  background:var(--bg);font:500 13px var(--mono);color:var(--muted)}
#load .t{font:800 30px var(--display);letter-spacing:.2em;color:var(--fg)}
#prog{width:200px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (max-width:520px){#bar{width:calc(100% - 24px);left:12px;transform:none;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #cut{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:none}
  #cutWrap{height:34vh}#cutRange{width:34vh}#hint{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  #layers{max-width:62vw}
  #layers{top:calc(66px + env(safe-area-inset-top,0px));left:12px;right:auto;max-width:none;justify-content:flex-start}}
#dimBtn{font:600 13px var(--display);border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:10px;padding:8px 10px;cursor:pointer}
#dimBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
#card{left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#card .row{display:flex;align-items:center;gap:8px}
#card .code{font:600 12px var(--mono);background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:3px 7px;white-space:nowrap}
#card .nm{font-weight:600;font-size:15px;line-height:1.25;min-width:0;flex:1}
#card .kind{font-size:12px;color:var(--muted)}
#card ul{margin:0;padding-left:18px;font-size:12px;color:var(--fg)}
#card .acts{display:flex;gap:6px;margin-top:4px}
#card .acts button{flex:1;font:600 13px var(--display);border-radius:10px;padding:10px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
#card .acts .go{background:var(--accent);color:var(--accent-fg);border-color:transparent;flex:2}
#gk{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#gkHead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
#gkHead .t{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gkHead .t small{display:block;font:400 11px var(--mono);color:var(--muted)}
#gkHead button{font:600 13px var(--display);border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:10px;padding:9px 12px;cursor:pointer}
#gkHead .close{background:var(--accent);color:var(--accent-fg);border-color:transparent}
#gkView{flex:1;position:relative;overflow:hidden;touch-action:none;background:#fff}
#gkImg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
#gkTip{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:400 11px var(--mono);color:#6f675e;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage"></div>

<div id="brand" class="panel"><b>ISSUE</b><small>Interior Cafe · model 3D desain · warna material asli</small></div>

<div id="layers" class="panel" role="group" aria-label="Lapisan">
  <button class="chip" id="ly-plafon" aria-pressed="true">Plafon</button>
  <button class="chip" id="ly-lampu" aria-pressed="true">Lampu</button>
  <button class="chip" id="ly-furnitur" aria-pressed="true">Furnitur</button>
  <button class="chip" id="ly-garis" aria-pressed="true">Garis</button>
</div>

<div id="cut" class="panel">
  <span class="lab">Potong</span>
  <span class="val" id="cutVal">+2,40</span>
  <div id="cutWrap"><input type="range" id="cutRange" min="0.05" max="3.6" step="0.01" value="2.4" aria-label="Tinggi potongan horizontal (m)"></div>
  <button id="full" title="Tampilkan bangunan utuh">Utuh</button>
</div>

<div id="bar" class="panel">
  <div class="seg" role="group" aria-label="Arah pandang">
    <button id="v-3d" class="on">3D</button><button id="v-top">Atas</button><button id="v-front">Depan</button><button id="v-side">Samping</button>
  </div>
  <select id="scene" aria-label="Scene"><option value="">Scene…</option></select>
  <button id="dimBtn" aria-pressed="false" hidden>Dimensi</button>
</div>

<div id="hint">1 jari: putar · 2 jari: zoom & geser · ketuk furnitur/dinding untuk detail</div>

<div id="card" class="panel" hidden>
  <div class="row"><span class="code" id="cCode"></span><span class="nm" id="cName"></span></div>
  <div class="kind" id="cKind"></div>
  <ul id="cMats"></ul>
  <div class="acts"><button class="go" id="cGo">Lihat gambar kerja</button><button id="cClose">Tutup</button></div>
</div>

<div id="gk" hidden>
  <div id="gkHead"><div class="t" id="gkTitle"></div><button id="gkFit">Pas layar</button><button class="close" id="gkClose">Tutup</button></div>
  <div id="gkView"><img id="gkImg" alt="Gambar kerja"><div id="gkTip">cubit / scroll untuk zoom · seret untuk geser</div></div>
</div>

<div id="load"><div class="t">ISSUE</div><div id="prog"><i></i></div><div id="loadTxt">Memuat model 3D…</div></div>

(function buildDims(){
  const solid = [], dashed = [];
  DIMS.forEach(([ax, c, pts, ext, side]) => {
    const a = pts[0], b = pts[pts.length - 1];
    if (ax === 'x'){
      solid.push(P(a - 150, c), P(b + 150, c));
      pts.forEach((p, i) => {
        solid.push(P(p - 45, c - 45), P(p + 45, c + 45));
        if (ext){ const e = ext[i]; const dir = Math.sign(e - c); dashed.push(P(p, e - dir * 60), P(p, c - dir * 120)); }
      });
      let nk = 0;
      for (let i = 0; i < pts.length - 1; i++){
        const span = pts[i + 1] - pts[i]; let off = 150; if (span < 600){ nk++; off = 150 + (nk % 2 ? 330 : 0); }
        const sp = textSprite(String(Math.round(span)));
        sp.position.copy(P((pts[i] + pts[i + 1]) / 2, c + side * (off + 60))); dimGroup.add(sp);
      }
    } else {
      solid.push(P(c, a - 150), P(c, b + 150));
      pts.forEach((p, i) => {
        solid.push(P(c - 45, p - 45), P(c + 45, p + 45));
        if (ext){ const e = ext[i]; const dir = Math.sign(e - c); dashed.push(P(e - dir * 60, p), P(c - dir * 120, p)); }
      });
      let nk = 0;
      for (let i = 0; i < pts.length - 1; i++){
        const span = pts[i + 1] - pts[i]; let off = 150; if (span < 600){ nk++; off = 150 + (nk % 2 ? 330 : 0); }
        const sp = textSprite(String(Math.round(span)), Math.PI / 2);
        sp.position.copy(P(c + side * (off + 60), (pts[i] + pts[i + 1]) / 2)); dimGroup.add(sp);
      }
    }
  });
  const lm = new THREE.LineBasicMaterial({color: 0x2a2622, depthTest: false});
  const ls = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(solid), lm); ls.renderOrder = 10; dimGroup.add(ls);
  const dm = new THREE.LineDashedMaterial({color: 0x6f675e, dashSize: 0.06, gapSize: 0.06, depthTest: false});
  const ld = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(dashed), dm); ld.computeLineDistances(); ld.renderOrder = 10; dimGroup.add(ld);
})();

const OBJIDS = {"1": "WF-01", "2": "WF-02", "3": "LF-09", "4": "BF-06", "5": "BF-05", "6": "BF-03", "7": "LF-06", "8": "BF-01", "9": "WF-03", "10": "BF-07", "11": "LF-01", "12": "LF-03", "13": "BF-04", "14": "BF-02", "15": "WF-04", "16": "LF-11", "17": "LF-10", "18": "LF-08", "19": "LF-07", "20": "LF-02", "21": "LF-05", "22": "LF-04"};
const pickables = [], allMeshes = [];
const ray = new THREE.Raycaster();
let down = null, nPtr = 0, selCode = null, hiMesh = null;
renderer.domElement.addEventListener('pointerdown', e => { nPtr++; down = nPtr === 1 ? {x: e.clientX, y: e.clientY, t: performance.now()} : null; });
const endPtr = e => {
  nPtr = Math.max(0, nPtr - 1);
  if (down && nPtr === 0 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8 && performance.now() - down.t < 450) pick(e);
  if (nPtr === 0) down = null;
};
renderer.domElement.addEventListener('pointerup', endPtr);
renderer.domElement.addEventListener('pointercancel', () => { nPtr = 0; down = null; });
function visibleChain(o){ for (; o; o = o.parent) if (!o.visible) return false; return true; }
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(v, orthoOn ? ortho : camera);
  const hits = ray.intersectObjects(allMeshes.filter(visibleChain), false);
  // anything nearer that is not pickable (walls without finish id etc.) also counts
  let id = 0;
  for (const h of hits){
    if (h.point.y > cutPlane.constant + 0.001) continue;
    const at = h.object.geometry.attributes._objid; id = at ? Math.round(at.getX(h.face.a)) : 0; break;
  }
  const code = OBJIDS[id];
  if (code && ITEMS[code]) select(code); else deselect();
}
function highlight(code){
  if (hiMesh){ scene.remove(hiMesh); hiMesh.geometry.dispose(); hiMesh = null; }
  if (!code) return;
  const ids = Object.keys(OBJIDS).filter(k => OBJIDS[k] === code).map(Number);
  const out = [];
  pickables.forEach(m => {
    const g = m.geometry, pos = g.attributes.position, oid = g.attributes._objid, idx = g.index;
    for (let i = 0; i < idx.count; i += 3){
      const a = idx.getX(i); if (ids.indexOf(Math.round(oid.getX(a))) < 0) continue;
      for (let k = 0; k < 3; k++){ const j = idx.getX(i + k); out.push(pos.getX(j), pos.getY(j), pos.getZ(j)); }
    }
  });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
  hiMesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color: 0xe07a4b, transparent: true, opacity: 0.38, side: THREE.DoubleSide,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, clippingPlanes: CLIP}));
  hiMesh.renderOrder = 5; scene.add(hiMesh);
}

let saved = null, z = {s: 1, x: 0, y: 0}, imgW = 1, imgH = 1;
const gkView = $('gkView'), gkImg = $('gkImg');
function applyZ(){ gkImg.style.transform = 'translate(' + z.x + 'px,' + z.y + 'px) scale(' + z.s + ')'; }
function fitImg(){ const W = gkView.clientWidth, H = gkView.clientHeight; z.s = Math.min(W / imgW, H / imgH); z.x = (W - imgW * z.s) / 2; z.y = (H - imgH * z.s) / 2; applyZ(); }

const gp = new Map(); let gl0 = null;
gkView.addEventListener('pointerdown', e => { gkView.setPointerCapture(e.pointerId); gp.set(e.pointerId, {x: e.clientX, y: e.clientY}); gl0 = null; });
gkView.addEventListener('pointermove', e => {
  const p = gp.get(e.pointerId); if (!p) return;
  if (gp.size === 1){ z.x += e.clientX - p.x; z.y += e.clientY - p.y; }
  p.x = e.clientX; p.y = e.clientY;
  if (gp.size >= 2){ const [a, b] = [...gp.values()]; const r = gkView.getBoundingClientRect();
    const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top, d = Math.hypot(a.x - b.x, a.y - b.y);
    if (gl0){ const k = d / gl0.d; zoomAt(cx, cy, k); z.x += cx - gl0.cx; z.y += cy - gl0.cy; }
    gl0 = {cx, cy, d}; }
  applyZ();
});
const gup = e => { gp.delete(e.pointerId); gl0 = null; };
gkView.addEventListener('pointerup', gup); gkView.addEventListener('pointercancel', gup);
function zoomAt(cx, cy, k){ const ns = Math.max(0.05, Math.min(8, z.s * k)); k = ns / z.s; z.x = cx - (cx - z.x) * k; z.y = cy - (cy - z.y) * k; z.s = ns; }
gkView.addEventListener('wheel', e => { e.preventDefault(); const r = gkView.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); applyZ(); }, {passive: false});

// load model
const loader = new THREE.GLTFLoader();
function onModel(gltf){
  const root = gltf.scene;
  root.traverse(o => {
    if (o.isMesh){
      const m = o.material;
      if (m.map){ m.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); m.map.encoding = THREE.sRGBEncoding; }
      const b = new THREE.MeshBasicMaterial({map: m.map || null, color: m.map ? 0xffffff : m.color.clone().convertSRGBToLinear(), side: THREE.DoubleSide,
        transparent: m.transparent, opacity: m.opacity, depthWrite: !m.transparent,
        polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, clippingPlanes: CLIP});
      b.name = m.name; o.material = b; m.dispose();
      if (b.transparent) o.renderOrder = 2;
    }
    if (o.isLine || o.isLineSegments){ o.material.transparent = true; o.material.opacity = 0.55; o.material.depthWrite = false; o.material.color.set(0x1a1714); o.material.clippingPlanes = CLIP; }
    if (o.isMesh && !o.material.transparent) allMeshes.push(o);
    if (o.isMesh && o.geometry.attributes._objid) pickables.push(o);
  });
  root.children.forEach(g => { groups[g.name] = g; });
  scene.add(root);
  const pts = [[-0.68,0],[8.82,0],[8.82,-13.83],[-0.68,-13.83],[-0.68,0]].map(p => new THREE.Vector3(p[0], 0, p[1]));
  cutRing = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0xb4552d}));
  scene.add(cutRing);
  setCut(2.4);
  $('load').hidden = true;
  fromHash();
}
function fail(){ $('loadTxt').textContent = 'Model gagal dimuat. Muat ulang halaman untuk mencoba lagi.'; }
// model is published as base64 text (binary .glb is not a served type)
(async () => {
  try {
    const res = await fetch('issue-glb.txt');
    if (!res.ok) throw new Error(res.status);
    const total = +res.headers.get('content-length') || 10415464;
    const reader = res.body.getReader(); const chunks = []; let got = 0;
    for (;;){
      const {done, value} = await reader.read(); if (done) break;
      chunks.push(value); got += value.length;
      $('prog').firstElementChild.style.width = Math.min(100, 100 * got / total).toFixed(0) + '%';
      $('loadTxt').textContent = 'Memuat model 3D… ' + Math.min(100, 100 * got / total).toFixed(0) + '%';
    }
    const txt = new TextDecoder().decode(await new Blob(chunks).arrayBuffer());
    const bin = atob(txt.trim()); const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    $('loadTxt').textContent = 'Menyiapkan tampilan…';
    loader.parse(buf.buffer, './', onModel, fail);
  } catch (e) { fail(); }
})();

function loop(now){
  requestAnimationFrame(loop);
  if (anim) anim(now);
  if (orthoOn) controls2.update(); else controls.update();
  renderer.render(scene, orthoOn ? ortho : camera);
}
requestAnimationFrame(loop);
})();
